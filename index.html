<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <h1>Student Registration Form</h1>
        <label for="roll_no">
            Roll no :</label>
        <input number"><br><br>
        <label for="Students_Name">Students Name :</label>
        <input type="text" placeholder="First Name">-
        <input type="text" placeholder="Last name">
        <br><br>
        <label for="Father_name">Father Name:</label>
        <input type="text"><br><br>
        <label for="DOF">DOB:</label>
        <input type="date"><br><br>
        <label for="Mobile_Number">Mobile number:</label>
        <input type="text" value="+91" size="1">-
        <input type="number"><br><br>
        <label for="Email_ID">Email ID :</label>
        <input type="email"><br><br>
        <label for="Password">Password:</label>
        <input type="password"><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="Gender" name="Gender">
        <label for="Male">Male</label>
        <input type="radio" id="Male" name="Gender">
        <label for="Female">Fermale</label>
        <input type="radio" id="Female" name="Gender">
        <label for="other">other</label>
        <br><br>
        <label for="Department">Department:</label>
        <input type="checkbox" id="Department" name="Department">
        <label for="CSE">CSE</label>
        <input type="checkbox" id="CSE" name="Department">
        <label for="IT">IT</label>
        <input type="checkbox" id="IT" name="Department">
        <label for="ECE">ECE</label>
        <input type="checkbox" id="ECE" name="Department">
        <label for="Civil">Civil</label>
        <input type="checkbox" id="Civil" name="Department">
        <label for="Mechanical">Mechanical</label>
        <br><br>
        <label for="Course">Course:</label>
        <select>
            <option>Select current course</option>
            <option>B.com</option>
            <option>B.A</option>

        </select>
        <br><br>
        <label for="student_photo">Student photo :</label>
        <input type="file">
        <br><br>
        <label for="city">City:</label>
        <input type="text">
        <br><br>
        <label for="Address">Address:</label>
        <textarea name="" id=""></textarea>
        <br><br>
        <input type="submit">
        <input type="Reset">



    </form>
</body>

</html>
